# project.yml — XcodeGen convierte esta receta en IPATest.xcodeproj
# IMPORTANTE: en YAML la sangría es con ESPACIOS, nunca con tabuladores.

name: IPATest                          # Nombre del proyecto Xcode

settings:
  base:
    SWIFT_VERSION: "5.0"               # Modo de lenguaje Swift 5 (el más tolerante)
    MARKETING_VERSION: "1.0"           # Versión visible de la app
    CURRENT_PROJECT_VERSION: "1"       # Número de compilación

targets:
  IPATest:
    type: application                  # Es una app (no una librería)
    platform: iOS
    deploymentTarget: "16.0"           # iOS mínimo soportado
    sources:
      - path: IPATest                  # Carpeta con el código Swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.ipatest   # Se sustituye automáticamente
        TARGETED_DEVICE_FAMILY: "1"    # 1 = solo iPhone

        # Xcode genera el Info.plist automáticamente con estas claves:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: IPATest              # Nombre bajo el icono
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"          # Pantalla completa moderna
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

        # Compilamos SIN firmar: la firma la pondrá Impactor/Sideloadly con tu Apple ID
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

# Esquema compartido: xcodebuild lo necesita para saber qué compilar
schemes:
  IPATest:
    build:
      targets:
        IPATest: all
    run:
      config: Debug
    archive:
      config: Release
